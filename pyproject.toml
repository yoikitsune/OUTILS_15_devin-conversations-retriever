[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-conversations-retriever"
version = "0.1.0"
description = "MCP server to decrypt, index, and search local Windsurf Cascade conversation histories"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Julien"},
]
dependencies = [
    "mcp>=1.27,<2",
    "cryptography>=43.0",
    "protobuf>=5.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
"devin-conversations-retriever" = "dcr.server:main"
"dcr" = "dcr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
